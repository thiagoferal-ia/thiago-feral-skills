* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 72px; }
/* capa */
.cover { position: relative; overflow: hidden; border-radius: 20px; padding: 28px 28px 24px; border: 1px solid var(--border);
  background: radial-gradient(120% 140% at 0% 0%, var(--hero-a), transparent 60%),
              radial-gradient(90% 120% at 100% 100%, var(--hero-b), transparent 55%), var(--surface-1); box-shadow: var(--shadow); }
.cover .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
.cover h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 6px; font-weight: 700; letter-spacing: -0.01em; }
.cover .sub { color: var(--text-secondary); margin: 0; max-width: 760px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: end; margin-top: 22px; }
.hero .hl { font-size: 13px; color: var(--text-secondary); }
.hero .hv { font-size: 60px; line-height: 1; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 8px; }
.hero .hc { font-size: 14px; color: var(--text-secondary); max-width: 460px; }
.theme-btn { position: absolute; top: 16px; right: 16px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
  border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }

nav.toc a { flex: none; font-size: 13px; color: var(--text-secondary); text-decoration: none; border: 1px solid var(--border);
  background: var(--surface-1); border-radius: 999px; padding: 4px 12px; }
nav.toc a:hover, nav.toc a.on { color: var(--text-primary); border-color: var(--axis); }
section.sec { margin-top: 40px; scroll-margin-top: 60px; }
.sec-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
.sec-n { font-size: 13px; font-weight: 650; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.sec-h h2 { font-size: 22px; margin: 0; font-weight: 680; letter-spacing: -0.01em; }
.sec-h .rule { flex: 1; height: 1px; background: var(--grid); align-self: center; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 15px; margin: 0 0 2px; font-weight: 640; }
.card .csub { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 14px; }
.grid2 > .card, .grid2 > .callout, .grid2 > .kpis { margin: 0; }
.md p { margin: 8px 0; } .md ul, .md ol { margin: 8px 0; padding-left: 22px; } .md li { margin: 3px 0; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 0.88em; background: var(--wash); padding: 1px 6px; border-radius: 5px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 14px 0; }

.kpi .l { font-size: 13px; color: var(--text-secondary); }
.kpi .v { font-size: 30px; font-weight: 640; line-height: 1.15; margin-top: 4px; letter-spacing: -0.01em; }
.kpi .d { font-size: 12.5px; margin-top: 4px; display: flex; gap: 4px; align-items: center; font-weight: 560; }
.kpi .n { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi .spark { margin-top: auto; padding-top: 8px; }
.up-good, .down-good { color: var(--good-text); } .up-bad, .down-bad { color: var(--bad-text); } .neutral { color: var(--text-secondary); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--text-secondary); font-size: 12.5px; }
tbody tr:hover td { background: var(--wash); }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { font-size: 12.5px; color: var(--text-muted); margin-top: 10px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: inherit; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-secondary); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-rect { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.key-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
details.tv { margin-top: 10px; font-size: 13px; }
details.tv summary { cursor: pointer; color: var(--text-muted); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.tv summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
details.tv[open] summary::before { transform: rotate(90deg); }
details.tv summary::-webkit-details-marker { display: none; }
.tip { position: fixed; pointer-events: none; z-index: 20; background: color-mix(in srgb, var(--surface-1) 94%, transparent);

  border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; font-size: 12.5px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.18); display: none; max-width: 300px; }
.tip .t { color: var(--text-secondary); margin-bottom: 5px; font-weight: 560; }
.tip .row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.tip .row b { font-weight: 680; font-variant-numeric: tabular-nums; }
.tip .row span { color: var(--text-secondary); }
.callout { display: flex; gap: 12px; border: 1px solid var(--border); border-radius: 16px;
  background: var(--surface-1); padding: 14px 16px; margin: 14px 0; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.callout::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cc); }
.callout .ic { flex: none; width: 22px; height: 22px; margin-top: 1px; }
.callout .lbl { font-size: 11.5px; font-weight: 680; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary); }
.callout h4 { margin: 2px 0 2px; font-size: 15.5px; }
.flow { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 0; }
.flow .node { flex: 1 1 0; min-width: 130px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; position: relative; }
.flow .node .nn { font-size: 11.5px; font-weight: 680; color: var(--text-muted); letter-spacing: .04em; }
.flow .node .nt { font-weight: 640; font-size: 14.5px; margin-top: 2px; }
.flow .node .nd { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
.flow .node .ns { font-size: 12px; margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary);
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.flow .arrow { flex: none; width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; text-align: center; gap: 2px; }
.flow .arrow svg { width: 24px; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.tl { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
.tl li { position: relative; padding: 0 0 16px 26px; }
.tl li::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -8px; width: 2px; background: var(--grid); border-radius: 1px; }
.tl li:last-child::before { display: none; }
.tl .tm { position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--s1); box-shadow: 0 0 0 3px var(--surface-1); }
.tl .when { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tl .what { font-weight: 640; font-size: 14.5px; }
.tl .det { font-size: 13px; color: var(--text-secondary); }
.prio { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; border-radius: 8px;
  background: var(--wash); color: var(--text-primary); }
.meters { display: grid; gap: 14px; }
.meter .mh { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; }
.meter .mh .mv { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter .ms { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.heat-scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.heat-scale .bar { display: flex; gap: 2px; } .heat-scale .bar i { width: 18px; height: 10px; border-radius: 2px; display: block; }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.anim .gx { transform-box: fill-box; transform-origin: left center; animation: growX .7s cubic-bezier(.2,.7,.2,1) both; }
.anim .gy { transform-box: fill-box; transform-origin: center bottom; animation: growY .7s cubic-bezier(.2,.7,.2,1) both; }
.anim .fi { animation: fadeIn .8s ease both; }
.anim .dl { animation: draw 1.1s cubic-bezier(.3,.6,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .anim .gx, .anim .gy, .anim .fi, .anim .dl { animation: none; } }
@media (max-width: 760px) {
  .cover { padding: 22px 18px 18px; } .cover h1 { font-size: 24px; padding-right: 64px; }
  .cover-grid { grid-template-columns: 1fr; gap: 14px; }
  .hero .hv { font-size: 48px; }
  .grid2 { grid-template-columns: 1fr; }
  .flow { flex-direction: column; }
  .flow .arrow { width: auto; height: 30px; flex-direction: row; gap: 6px; }
  .flow .arrow svg { transform: rotate(90deg); }
}
@media print { .theme-btn, nav.toc { display: none; } .card, .kpi, .callout { break-inside: avoid; box-shadow: none; } }
